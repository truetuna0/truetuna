<!DOCTYPE html>
<html lang="ko" class="dark" style="color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUNA 자동 감지 통합 키맵퍼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      background-color: #202225;
      color: #dcddde;
      font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      user-select: none;
    }
    select, option {
      background-color: #2f3136 !important;
      color: #ffffff !important;
    }
    option:checked, option:hover {
      background-color: #5865f2 !important;
      color: #ffffff !important;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #202225; }
    ::-webkit-scrollbar-thumb { background: #4f545c; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #5865f2; }
  </style>
</head>
<body class="min-h-screen flex flex-col text-sm antialiased">

  <header class="bg-[#2f3136] border-b border-[#202225] px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 shadow-md">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-orange-500 p-0.5 flex items-center justify-center shadow">
        <div class="w-full h-full bg-[#202225] rounded-[7px] flex items-center justify-center font-bold text-cyan-400 text-xs">
          TUNA
        </div>
      </div>
      <div>
        <h1 class="text-base font-extrabold text-white tracking-wide flex items-center gap-2">
          <span>TUNA 통합 키맵퍼 (자동 감지)</span>
          <span id="badgeDevice" class="text-[10px] px-2 py-0.5 rounded bg-cyan-900/60 text-cyan-300 border border-cyan-700/50">기기 대기 중</span>
        </h1>
        <p class="text-[11px] text-gray-400">연결 시 보드 규격(10K/15K/20K) 자동 식별 및 동기화</p>
      </div>
    </div>

    <div class="flex items-center gap-2 bg-[#202225] p-1.5 rounded-lg border border-gray-700/60">
      <button id="btnConnect" onclick="directOpenSerialPort()" class="bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs px-4 py-1.5 rounded font-bold transition flex items-center gap-1.5 shadow">
        <span>🔌</span>
        <span>직렬 포트 연결 및 자동 인식</span>
      </button>

      <button onclick="resetSerialLock()" title="포트 점유 락 강제 해제" class="bg-gray-700 hover:bg-gray-600 text-gray-300 text-xs px-2.5 py-1.5 rounded transition">
        🔄 포트 리셋
      </button>

      <button onclick="sendBootloaderCommand()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs px-2.5 py-1.5 rounded font-semibold transition">
        ⚡ 부트로더
      </button>

      <div class="flex items-center gap-1.5 px-2">
        <span id="statusLed" class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
        <span id="statusText" class="text-xs text-red-400 font-medium">연결 안 됨</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="loadProfileFromFile()" class="bg-[#4f545c] hover:bg-gray-600 text-white text-xs px-2.5 py-1.5 rounded transition">
        PC 불러오기
      </button>
      <button onclick="saveProfileToFile()" class="bg-[#4f545c] hover:bg-gray-600 text-white text-xs px-2.5 py-1.5 rounded transition">
        PC 저장
      </button>
      <button id="btnReadBoard" onclick="readFromBoard()" class="bg-[#4f545c] hover:bg-gray-600 text-white text-xs px-3 py-1.5 rounded font-semibold transition">
        보드 읽기
      </button>
      <button id="btnWriteBoard" onclick="writeToBoard()" class="bg-[#ed4245] hover:bg-red-600 text-white text-xs px-3.5 py-1.5 rounded font-bold transition shadow-lg">
        보드에 저장
      </button>
    </div>
  </header>

  <div class="bg-[#202225] border-b border-gray-800 px-6 py-2.5 flex items-center justify-between">
    <div class="flex items-center gap-2" id="modeButtonsContainer">
      <button onclick="switchMode(1)" id="btnMode1" class="mode-btn px-6 py-1 rounded text-xs font-bold bg-[#5865f2] text-white shadow">M1</button>
      <button onclick="switchMode(2)" id="btnMode2" class="mode-btn px-6 py-1 rounded text-xs font-bold bg-[#2f3136] text-gray-400 hover:text-white">M2</button>
      <button onclick="switchMode(3)" id="btnMode3" class="mode-btn px-6 py-1 rounded text-xs font-bold bg-[#2f3136] text-gray-400 hover:text-white">M3</button>
      <button onclick="switchMode(4)" id="btnMode4" class="mode-btn px-6 py-1 rounded text-xs font-bold bg-[#2f3136] text-gray-400 hover:text-white">M4</button>
    </div>

    <div class="flex items-center gap-2">
      <span class="text-xs text-gray-400">현재 모드 이름:</span>
      <input type="text" id="txtModeName" oninput="onModeNameChanged()" class="bg-[#2f3136] border border-gray-700 text-white text-xs rounded px-2.5 py-1 w-44 outline-none focus:border-cyan-400" placeholder="모드 이름">
    </div>
  </div>

  <main class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-12 gap-4 overflow-auto">
    <div class="lg:col-span-7 bg-[#2f3136] rounded-xl p-4 border border-gray-800 flex flex-col shadow-sm">
      <div class="flex items-center justify-between pb-3 border-b border-gray-700/60 mb-3">
        <h2 id="lblLayoutTitle" class="text-sm font-bold text-white flex items-center gap-2">
          <span>키패드 물리 배치도</span>
          <span class="text-xs font-normal text-cyan-400">(자동 감지된 기종 배선 적용됨)</span>
        </h2>
        <span class="text-xs text-gray-400">스위치 키를 클릭하여 매크로를 편집합니다.</span>
      </div>
      <div id="switchBoardContainer" class="flex-1 flex items-center justify-center p-2 overflow-auto"></div>
    </div>

    <div class="lg:col-span-5 flex flex-col gap-3">
      <div class="bg-[#2f3136] rounded-xl p-4 border border-gray-800 shadow-sm flex flex-col gap-3">
        <div class="flex items-center justify-between border-b border-gray-700/60 pb-2">
          <div id="lblSelectedTarget" class="text-sm font-bold text-cyan-400">선택된 키: [ M1 / ID ? ]</div>
          <span id="lblLockIndicator" class="hidden text-xs text-red-400 font-bold bg-red-950/60 border border-red-700/50 px-2 py-0.5 rounded">🔒 잠김</span>
        </div>

        <div class="flex items-center justify-between gap-2">
          <span class="text-xs text-gray-300 font-medium">동작 방식:</span>
          <select id="selKeyType" onchange="onKeyTypeChanged()" class="flex-1 bg-[#202225] border border-gray-700 text-white text-xs rounded px-2.5 py-1.5 outline-none focus:border-cyan-400">
            <option value="N">일반 실행 (단발 매크로)</option>
            <option value="R">연속 입력 (누르고 있으면 반복)</option>
            <option value="H">짧게/길게 누르기 (Tap & Hold)</option>
          </select>
        </div>

        <div id="holdTargetRow" class="hidden bg-[#202225] p-2 rounded flex items-center justify-around border border-amber-500/30">
          <label class="flex items-center gap-1.5 text-xs text-white cursor-pointer">
            <input type="radio" name="subTarget" value="tap" checked onchange="onSubTargetChanged()" class="accent-cyan-400">
            <span>1. 짧게 누름 (Tap)</span>
          </label>
          <label class="flex items-center gap-1.5 text-xs text-amber-400 cursor-pointer">
            <input type="radio" name="subTarget" value="hold" onchange="onSubTargetChanged()" class="accent-amber-400">
            <span>2. 길게 누름 (Hold 0.45s)</span>
          </label>
        </div>

        <div class="flex items-center gap-2">
          <span id="lblMacroNameTitle" class="text-xs text-amber-400 font-medium whitespace-nowrap">OLED 표시 이름:</span>
          <input type="text" id="txtMacroLabel" maxlength="12" class="flex-1 bg-[#202225] border border-gray-700 text-white text-xs rounded px-2.5 py-1.5 outline-none focus:border-cyan-400" placeholder="화면에 출력될 이름">
        </div>
      </div>

      <div class="bg-[#2f3136] rounded-xl p-4 border border-gray-800 shadow-sm flex flex-col gap-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-gray-200">키보드 실시간 시퀀스 레코더</span>
          <div class="flex items-center gap-1.5">
            <button id="btnRecStart" onclick="startMacroRecord()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2.5 py-1 rounded font-bold transition">● 기록 시작</button>
            <button id="btnRecStop" onclick="stopMacroRecord()" disabled class="bg-gray-600 text-gray-400 text-xs px-2.5 py-1 rounded font-semibold transition cursor-not-allowed">■ 기록 완료</button>
            <button onclick="clearCurrentSequence()" class="bg-gray-700 hover:bg-gray-600 text-white text-xs px-2 py-1 rounded transition">비우기</button>
          </div>
        </div>

        <input type="text" id="recCaptureBox" readonly value="[기록 시작] 클릭 후 실제 키보드를 직접 타이핑하세요" class="bg-[#202225] text-cyan-300 text-xs px-3 py-2 rounded border border-gray-700 outline-none text-center">

        <div class="flex flex-col gap-1">
          <select id="macroEventList" size="7" class="w-full bg-[#202225] text-gray-200 text-xs rounded p-1.5 border border-gray-700 outline-none font-mono"></select>
          <div class="flex items-center justify-between text-[11px] text-gray-400 px-1">
            <div class="flex items-center gap-1">
              <button onclick="deleteSelectedEvent()" class="hover:text-red-400 bg-[#202225] px-2 py-0.5 rounded border border-gray-700">선택 삭제 (Del)</button>
              <button onclick="insertManualDelay()" class="hover:text-cyan-400 bg-[#202225] px-2 py-0.5 rounded border border-gray-700">+ 딜레이 삽입</button>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="moveEventUp()" class="hover:text-white bg-[#202225] px-2 py-0.5 rounded border border-gray-700">▲ 위로</button>
              <button onclick="moveEventDown()" class="hover:text-white bg-[#202225] px-2 py-0.5 rounded border border-gray-700">▼ 아래로</button>
            </div>
          </div>
        </div>

        <div class="bg-[#202225] p-2.5 rounded-lg border border-gray-700/70 flex flex-col gap-2 mt-1">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <span class="text-[10px] text-gray-400 block mb-0.5">카테고리:</span>
              <select id="selCategory" onchange="onCategoryChanged()" class="w-full bg-[#2f3136] text-white text-xs rounded p-1 border border-gray-600 outline-none">
                <option value="HWP">HWP (한글 오피스)</option>
                <option value="PPT">PPT (파워포인트)</option>
                <option value="SPECIAL">특수작업 / 유튜브 배속</option>
                <option value="FN">기능키 (F1~F12)</option>
                <option value="EDIT">편집 및 방향키</option>
                <option value="NUMPAD">넘패드 (텐키)</option>
              </select>
            </div>
            <div>
              <span class="text-[10px] text-gray-400 block mb-0.5">단축키 목록 (선택 시 자동 이름 반영):</span>
              <select id="selKeyItem" onchange="onKeyItemChanged()" class="w-full bg-[#2f3136] text-white text-xs rounded p-1 border border-gray-600 outline-none"></select>
            </div>
          </div>
          <button onclick="addCatalogKeyToSequence()" class="bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs py-1.5 rounded font-bold transition text-center shadow">
            + 선택한 단축키 매크로 시퀀스에 추가
          </button>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-gray-700/50">
          <button onclick="removeAllDelays()" class="text-xs text-gray-300 hover:text-white bg-[#202225] border border-gray-700 px-3 py-1.5 rounded">
            딜레이 일괄 제거
          </button>
          <button id="btnApplyKey" onclick="applyMacroToKey()" class="bg-[#4f545c] hover:bg-gray-600 text-white text-xs px-6 py-2 rounded font-bold transition shadow">
            현재 키에 적용
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    function mk_single(k) { return [{t:"p", k:k}, {t:"r", k:k}]; }
    function createSingleKey(k) { return mk_single(k); }

    const DEVICE_CONFIGS = {
      tuna_pad_10k_oled: {
        title: "tuna_pad_10k_oled (10키 OLED)",
        ack_keys: ["ACK_TUNA_10K_OLED"],
        supports_hold: true,
        supports_sw_lock: true,
        supports_read_all: true,
        mode_1_locked: false,
        protocol: "full",
        switches: [
          { num: 1, title: "스위치 1 (SW1)", up: 2, down: 3, left: 1, right: 0, push: 4 },
          { num: 2, title: "스위치 2 (SW2)", up: 7, down: 8, left: 6, right: 5, push: 9 }
        ]
      },
      tuna_pad_15k: {
        title: "tuna_pad_15k (15키 3스위치)",
        ack_keys: ["ACK_TUNA_15K"],
        supports_hold: false,
        supports_sw_lock: false,
        supports_read_all: false,
        mode_1_locked: true,
        protocol: "15k_legacy",
        switches: [
          { num: 1, title: "스위치 1 (SW1 상단)", up: 2, down: 3, left: 1, right: 0, push: 4, colspan: 2 },
          { num: 2, title: "스위치 2 (SW2 하좌)", up: 8, down: 7, left: 5, right: 6, push: 9 },
          { num: 3, title: "스위치 3 (SW3 하우)", up: 13, down: 12, left: 10, right: 11, push: 14 }
        ]
      },
      tuna_20k_orange: {
        title: "tuna_20k_orange (20키 오렌지 규격)",
        ack_keys: ["ACK_TUNA_20K_ORANGE"],
        supports_hold: true,
        supports_sw_lock: true,
        supports_read_all: true,
        mode_1_locked: false,
        protocol: "full",
        switches: [
          { num: 1, title: "스위치 1 (SW1)", up: 1, down: 0, left: 3, right: 2, push: 4 },
          { num: 2, title: "스위치 2 (SW2 - 오렌지 좌7/우8)", up: 6, down: 5, left: 7, right: 8, push: 9 },
          { num: 3, title: "스위치 3 (SW3)", up: 11, down: 10, left: 13, right: 12, push: 14 },
          { num: 4, title: "스위치 4 (SW4 - 오렌지 좌17/우18)", up: 16, down: 15, left: 17, right: 18, push: 19 }
        ]
      },
      tuna_20k_oled: {
        title: "tuna_20k_oled (20키 OLED 표준)",
        ack_keys: ["ACK_TUNA_20K_OLED", "ACK_TUNA_20K"],
        supports_hold: true,
        supports_sw_lock: true,
        supports_read_all: true,
        mode_1_locked: false,
        protocol: "full",
        switches: [
          { num: 1, title: "스위치 1 (SW1)", up: 1, down: 0, left: 3, right: 2, push: 4 },
          { num: 2, title: "스위치 2 (SW2 - 표준 좌8/우7)", up: 6, down: 5, left: 8, right: 7, push: 9 },
          { num: 3, title: "스위치 3 (SW3)", up: 11, down: 10, left: 13, right: 12, push: 14 },
          { num: 4, title: "스위치 4 (SW4 - 표준 좌18/우17)", up: 16, down: 15, left: 18, right: 17, push: 19 }
        ]
      }
    };

    const PRESETS = {
      // HWP 신규/수정 프리셋
      "문단번호리셋 (Ctrl+K,N Alt+G Alt+D)": {
        label: "번호리셋",
        seq: [
          {t:"p",k:"Ctrl"},{t:"p",k:"k"},{t:"r",k:"k"},{t:"d",ms:30},
          {t:"p",k:"n"},{t:"r",k:"n"},{t:"r",k:"Ctrl"},{t:"d",ms:120},
          {t:"p",k:"Alt"},{t:"p",k:"g"},{t:"r",k:"g"},{t:"r",k:"Alt"},{t:"d",ms:50},
          {t:"p",k:"Alt"},{t:"p",k:"d"},{t:"r",k:"d"},{t:"r",k:"Alt"}
        ]
      },
      "글머리표 (Ctrl+Shift+Delete)": {
        label: "글머리표",
        seq: [
          {t:"p",k:"Ctrl"},{t:"p",k:"Shift"},{t:"p",k:"Delete"},
          {t:"r",k:"Delete"},{t:"r",k:"Shift"},{t:"r",k:"Ctrl"}
        ]
      },
      "문단번호 (Ctrl+Shift+Insert)": {
        label: "문단번호",
        seq: [
          {t:"p",k:"Ctrl"},{t:"p",k:"Shift"},{t:"p",k:"Insert"},
          {t:"r",k:"Insert"},{t:"r",k:"Shift"},{t:"r",k:"Ctrl"}
        ]
      },

      // 기본 HWP 프리셋
      "자간좁게 (Shift+Alt+N)": { label: "자간좁게", seq: [{t:"p",k:"Shift"},{t:"p",k:"Alt"},{t:"p",k:"n"},{t:"r",k:"n"},{t:"r",k:"Alt"},{t:"r",k:"Shift"}] },
      "자간넓게 (Shift+Alt+W)": { label: "자간넓게", seq: [{t:"p",k:"Shift"},{t:"p",k:"Alt"},{t:"p",k:"w"},{t:"r",k:"w"},{t:"r",k:"Alt"},{t:"r",k:"Shift"}] },
      "글씨작게 (Ctrl+A Shift+Alt+R)": { label: "글씨작게", seq: [{t:"p",k:"Ctrl"},{t:"p",k:"a"},{t:"r",k:"a"},{t:"r",k:"Ctrl"},{t:"d",ms:30},{t:"p",k:"Shift"},{t:"p",k:"Alt"},{t:"p",k:"r"},{t:"r",k:"r"},{t:"r",k:"Alt"},{t:"r",k:"Shift"}] },
      "글씨크게 (Ctrl+A Ctrl+])": { label: "글씨크게", seq: [{t:"p",k:"Ctrl"},{t:"p",k:"a"},{t:"r",k:"a"},{t:"r",k:"Ctrl"},{t:"d",ms:30},{t:"p",k:"Ctrl"},{t:"p",k:"]"},{t:"r",k:"]"},{t:"r",k:"Ctrl"}] },
      "문단간격좁게 (Ctrl+A Shift+Alt+A)": { label: "문단좁게", seq: [{t:"p",k:"Ctrl"},{t:"p",k:"a"},{t:"r",k:"a"},{t:"r",k:"Ctrl"},{t:"d",ms:30},{t:"p",k:"Shift"},{t:"p",k:"Alt"},{t:"p",k:"a"},{t:"r",k:"a"},{t:"r",k:"Alt"},{t:"r",k:"Shift"}] },
      "문단간격넓게 (Ctrl+A Shift+Alt+Z)": { label: "문단넓게", seq: [{t:"p",k:"Ctrl"},{t:"p",k:"a"},{t:"r",k:"a"},{t:"r",k:"Ctrl"},{t:"d",ms:30},{t:"p",k:"Shift"},{t:"p",k:"Alt"},{t:"p",k:"z"},{t:"r",k:"z"},{t:"r",k:"Alt"},{t:"r",k:"Shift"}] },
      "모양복사 (Alt+C Enter)": { label: "모양복사", seq: [{t:"p",k:"Alt"},{t:"p",k:"c"},{t:"r",k:"c"},{t:"r",k:"Alt"},{t:"d",ms:80},{t:"p",k:"Enter"},{t:"r",k:"Enter"}] },
      "모양붙이기 (Alt+C Esc)": { label: "모양붙이기", seq: [{t:"p",k:"Alt"},{t:"p",k:"c"},{t:"r",k:"c"},{t:"r",k:"Alt"},{t:"d",ms:50},{t:"p",k:"Esc"},{t:"r",k:"Esc"}] },
      "개요삽입 (Ctrl+Insert)": { label: "개요삽입", seq: [{t:"p",k:"Ctrl"},{t:"p",k:"Insert"},{t:"r",k:"Insert"},{t:"r",k:"Ctrl"}] },
      "번호다운 (Ctrl + KP +)": { label: "번호다운", seq: [{t:"p",k:"Ctrl"},{t:"p",k:"KP +"},{t:"r",k:"KP +"},{t:"r",k:"Ctrl"}] },
      "번호업 (Ctrl + KP -)": { label: "번호업", seq: [{t:"p",k:"Ctrl"},{t:"p",k:"KP -"},{t:"r",k:"KP -"},{t:"r",k:"Ctrl"}] },

    function parseSeqString(s) {
      if (!s) return [];
      const evs = [];
      s.split(";").forEach(token => {
        token = token.trim();
        if (token.startsWith("P_")) evs.push({ t: "p", k: token.substring(2) });
        else if (token.startsWith("R_")) evs.push({ t: "r", k: token.substring(2) });
        else if (token.startsWith("D_")) {
          const ms = parseInt(token.substring(2), 10);
          if (!isNaN(ms)) evs.push({ t: "d", ms: ms });
        }
      });
      return evs;
    }

    async function directOpenSerialPort() {
      if (serialPort && serialPort.readable) {
        await resetSerialLock();
        return;
      }

      if (!("serial" in navigator)) {
        alert("현재 브라우저는 Web Serial API를 지원하지 않습니다. 크롬 또는 엣지를 사용해 주세요.");
        return;
      }

      try {
        let port = null;
        try { port = await navigator.serial.requestPort({ filters: [] }); }
        catch (e) { port = await navigator.serial.requestPort(); }

        if (!port) return;

        await port.open({ baudRate: 115200 });
        serialPort = port;

        document.getElementById("btnConnect").innerHTML = "<span>❌</span><span>연결 해제</span>";
        document.getElementById("btnConnect").className = "bg-rose-600 hover:bg-rose-700 text-white text-xs px-3.5 py-1.5 rounded font-bold transition shadow";
        setStatus("직결 연결 성공 (기종 확인 중...)", "warn");

        startReadLoop();

        setTimeout(() => {
          sendSerialText("PING_TUNA\n");
        }, 150);

      } catch (err) {
        if (err.name === "NotFoundError") {
          setStatus("포트 선택이 취소되었습니다", "warn");
        } else {
          setStatus("포트 에러: " + err.message, "err");
        }
      }
    }

    async function resetSerialLock() {
      try {
        readLoopActive = false;
        if (serialReader) {
          try { await serialReader.cancel(); } catch(e) {}
          try { serialReader.releaseLock(); } catch(e) {}
          serialReader = null;
        }
        if (serialPort) {
          try { await serialPort.close(); } catch(e) {}
          serialPort = null;
        }
        sendLock = Promise.resolve();
        setStatus("포트 잠금 해제됨", "ok");
        document.getElementById("btnConnect").innerHTML = "<span>🔌</span><span>직렬 포트 연결 및 자동 인식</span>";
        document.getElementById("btnConnect").className = "bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs px-4 py-1.5 rounded font-bold transition flex items-center gap-1.5 shadow";
      } catch (err) {
        setStatus("리셋 실패: " + err.message, "err");
      }
    }

    function sendSerialText(text) {
      if (!serialPort || !serialPort.writable) return Promise.resolve();
      sendLock = sendLock.then(async () => {
        try {
          if (!serialPort || !serialPort.writable) return;
          const encoder = new TextEncoder();
          const writer = serialPort.writable.getWriter();
          try {
            await writer.write(encoder.encode(text));
          } finally {
            writer.releaseLock();
          }
        } catch (e) {
          console.error("sendSerialText 에러:", e);
        }
      });
      return sendLock;
    }

    async function startReadLoop() {
      if (!serialPort || !serialPort.readable) return;
      readLoopActive = true;
      const textDecoder = new TextDecoderStream();
      const readableStreamClosed = serialPort.readable.pipeTo(textDecoder.writable);
      const reader = textDecoder.readable.getReader();
      serialReader = reader;

      let buffer = "";
      try {
        while (readLoopActive) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) {
            buffer += value;
            const lines = buffer.split("\n");
            buffer = lines.pop();

            for (const line of lines) {
              handleIncomingLine(line.trim());
            }
          }
        }
      } catch (err) {
      } finally {
        reader.releaseLock();
      }
    }

    function handleIncomingLine(line) {
      if (!line) return;

      for (const [devKey, devConf] of Object.entries(DEVICE_CONFIGS)) {
        if (devConf.ack_keys.some(ack => line.includes(ack))) {
          if (currentDevKey !== devKey) {
            currentDevKey = devKey;
            renderDeviceLayout();
            switchMode(currentMode);
            document.getElementById("badgeDevice").textContent = devConf.title;
            setStatus(`기종 자동 인식 완료: ${devConf.title}`, "ok");
            
            setTimeout(() => { readFromBoard(); }, 150);
          }
          return;
        }
      }

      if (line.startsWith("NAME:")) {
        const parts = line.split(":");
        if (parts.length >= 3) {
          const mNum = parseInt(parts[1], 10);
          const mName = parts.slice(2).join(":");
          if (profiles[currentDevKey]?.mode_names) {
            profiles[currentDevKey].mode_names[mNum] = mName;
          }
        }
      } else if (line.startsWith("KEY:")) {
        const parts = line.split(":");
        if (parts.length >= 7) {
          const sub = parts[1].split(",");
          const mNum = parseInt(sub[0], 10);
          const kid = sub[1];
          const ktype = parts[2];
          const labelStr = parts[3];
          const macroStr = parts[4];
          const holdLabelStr = parts[5];
          const holdMacroStr = parts[6];

          if (profiles[currentDevKey]?.modes?.[mNum]) {
            profiles[currentDevKey].modes[mNum][kid] = {
              type: ktype,
              label: labelStr,
              macro: parseSeqString(macroStr),
              hold_label: holdLabelStr,
              hold_macro: parseSeqString(holdMacroStr)
            };
          }
        }
      } else if (line === "READ_DONE") {
        isReadingBoard = false;
        if (readTimeoutTimer) clearTimeout(readTimeoutTimer);
        setStatus("보드 설정 동기화 완료!", "ok");
        const btn = document.getElementById("btnReadBoard");
        btn.textContent = "보드에서 읽음";
        btn.className = "bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded font-semibold transition";
        switchMode(currentMode);
      } else if (line.includes("ACK:SAVE_OK")) {
        setStatus("보드 NVS 영구 저장 완료!", "ok");
        const btn = document.getElementById("btnWriteBoard");
        btn.textContent = "보드에 저장완료";
        btn.className = "bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3.5 py-1.5 rounded font-bold transition shadow-lg";
      }
    }

    async function sendBootloaderCommand() {
      if (!serialPort || !serialPort.writable) {
        alert("먼저 포트를 연결해 주세요.");
        return;
      }
      if (confirm("ESP32-S3를 다운로드 모드(부트로더)로 진입시키겠습니까?")) {
        await sendSerialText("CMD_BOOTLOADER\n");
        setStatus("다운로드 모드 진입 성공", "ok");
        await resetSerialLock();
      }
    }

      cfg.switches.forEach(sw => {

        if (sw.colspan === 2) {

        const swHeader = document.createElement("div");
        swHeader.className = "flex items-center justify-between border-b border-gray-700/50 pb-1.5";
        swHeader.innerHTML = `<span class="text-xs font-bold text-cyan-400">${sw.title}</span>`;

        if (cfg.supports_sw_lock) {
          const lockBtn = document.createElement("button");
          const isLocked = profiles[currentDevKey]?.sw_locks?.[currentMode]?.[sw.num] || false;
          lockBtn.id = `btnLock_sw${sw.num}`;
          lockBtn.className = isLocked ? "text-[11px] px-2 py-0.5 rounded bg-rose-600 text-white font-bold" : "text-[11px] px-2 py-0.5 rounded bg-gray-700 text-gray-300 hover:text-white";
          lockBtn.textContent = isLocked ? "🔒 잠김" : "🔓 해제";
          lockBtn.onclick = () => toggleSwLock(sw.num);
          swHeader.appendChild(lockBtn);
        }
        swBox.appendChild(swHeader);

        const padGrid = document.createElement("div");
        padGrid.className = "grid grid-cols-3 gap-1.5 p-1 items-center justify-center";

        padGrid.appendChild(document.createElement("div"));
        padGrid.appendChild(createKeyButton(sw.up, "UP"));
        padGrid.appendChild(document.createElement("div"));

        padGrid.appendChild(createKeyButton(sw.left, "LEFT"));
        padGrid.appendChild(createKeyButton(sw.push, "PUSH", true));
        padGrid.appendChild(createKeyButton(sw.right, "RIGHT"));

        padGrid.appendChild(document.createElement("div"));
        padGrid.appendChild(createKeyButton(sw.down, "DOWN"));
        padGrid.appendChild(document.createElement("div"));

        swBox.appendChild(padGrid);
        grid.appendChild(swBox);
      });

      container.appendChild(grid);
    }

    function createKeyButton(keyId, dir, isPush = false) {
      const btn = document.createElement("button");
      btn.id = `keyBtn_${keyId}`;
      btn.dataset.keyId = keyId;
      btn.dataset.dir = dir;
      btn.className = `w-20 h-14 rounded-lg flex flex-col items-center justify-center text-center p-1 border transition ${
        isPush ? 'bg-[#4f545c] border-gray-600 hover:border-cyan-400' : 'bg-[#40444b] border-gray-700 hover:border-cyan-400'
      }`;

      btn.onclick = () => selectKeyForEdit(keyId);
      updateKeyButtonContent(btn);
      return btn;
    }

    function updateKeyButtonContent(btn) {
      const kid = btn.dataset.keyId;
      const dir = btn.dataset.dir;
      const keyData = profiles[currentDevKey]?.modes?.[currentMode]?.[kid] || { type: "N", label: "미설정" };

      let label = keyData.label || "미설정";
      if (keyData.type === "R") label += " (연속)";
      else if (keyData.type === "H") label += `/[H]${(keyData.hold_label || "").substring(0, 3)}`;

      btn.innerHTML = `<span class="text-[10px] text-gray-400 font-mono leading-none">[${dir}]</span><span class="text-xs font-semibold text-white truncate max-w-full mt-0.5">${label}</span>`;
    }

    function selectKeyForEdit(keyId) {
      selectedKeyId = String(keyId);

      document.querySelectorAll("[id^='keyBtn_']").forEach(b => {
        if (b.dataset.keyId === selectedKeyId) {
          b.classList.add("ring-2", "ring-cyan-400", "bg-cyan-900/40");
        } else {
          b.classList.remove("ring-2", "ring-cyan-400", "bg-cyan-900/40");
        }
      });

      const btn = document.getElementById(`keyBtn_${selectedKeyId}`);
      const dir = btn ? btn.dataset.dir : "KEY";
      document.getElementById("lblSelectedTarget").textContent = `선택된 키: [ M${currentMode} / ${dir} (ID ${selectedKeyId}) ]`;

      const cfg = DEVICE_CONFIGS[currentDevKey];
      const keyData = profiles[currentDevKey]?.modes?.[currentMode]?.[selectedKeyId] || { type:"N", label:"미설정", macro:[], hold_label:"", hold_macro:[] };

      const selType = document.getElementById("selKeyType");
      if (!cfg.supports_hold) {
        selType.innerHTML = `<option value="N">일반 실행 (단발 매크로)</option>`;
        selType.value = "N";
        document.getElementById("holdTargetRow").classList.add("hidden");
      } else {
        selType.innerHTML = `
          <option value="N">일반 실행 (단발 매크로)</option>
          <option value="R">연속 입력 (누르고 있으면 반복)</option>
          <option value="H">짧게/길게 누르기 (Tap & Hold)</option>
        `;
        selType.value = keyData.type || "N";
        if (keyData.type === "H") {
          document.getElementById("holdTargetRow").classList.remove("hidden");
        } else {
          document.getElementById("holdTargetRow").classList.add("hidden");
        }
      }

      refreshEditorView();
    }

    function refreshEditorView() {
      const keyData = profiles[currentDevKey]?.modes?.[currentMode]?.[selectedKeyId] || { type:"N", label:"", macro:[], hold_label:"", hold_macro:[] };
      const selTypeVal = document.getElementById("selKeyType").value;

      if (selTypeVal === "H" && subTarget === "hold") {
        document.getElementById("lblMacroNameTitle").textContent = "길게 누를 때 이름:";
        document.getElementById("txtMacroLabel").value = keyData.hold_label || "";
        currentEditingEvents = JSON.parse(JSON.stringify(keyData.hold_macro || []));
      } else {
        document.getElementById("lblMacroNameTitle").textContent = "OLED 표시 이름:";
        document.getElementById("txtMacroLabel").value = keyData.label || "";
        currentEditingEvents = JSON.parse(JSON.stringify(keyData.macro || []));
      }

      renderEventList();
      checkLockState();
    }

    function renderEventList() {
      const list = document.getElementById("macroEventList");
      list.innerHTML = "";
      currentEditingEvents.forEach((ev, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        if (ev.t === "d") {
          opt.textContent = `  [대기] ${ev.ms} ms`;
          opt.className = "text-amber-400";
        } else if (ev.t === "p") {
          opt.textContent = `▼ 누름: ${ev.k}`;
          opt.className = "text-emerald-400";
        } else if (ev.t === "r") {
          opt.textContent = `▲ 뗌:   ${ev.k}`;
          opt.className = "text-rose-400";
        }
        list.appendChild(opt);
      });
    }

    function checkLockState() {
      const cfg = DEVICE_CONFIGS[currentDevKey];
      const isMode1Fixed = (cfg.mode_1_locked && currentMode === 1);
      const isLocked = isCurrentKeyLocked();

      const lockIndicator = document.getElementById("lblLockIndicator");
      const disabled = isMode1Fixed || isLocked;

      if (isMode1Fixed || isLocked) {
        lockIndicator.classList.remove("hidden");
        lockIndicator.textContent = isMode1Fixed ? "M1 고정 (수정 불가)" : "🔒 스위치 잠김";
      } else {
        lockIndicator.classList.add("hidden");
      }

      document.getElementById("selKeyType").disabled = disabled;
      document.getElementById("txtMacroLabel").disabled = disabled;
      document.getElementById("btnRecStart").disabled = disabled;
      document.getElementById("btnApplyKey").disabled = disabled;
    }

    function isCurrentKeyLocked() {
      const cfg = DEVICE_CONFIGS[currentDevKey];
      if (!cfg.supports_sw_lock) return false;
      const sw = cfg.switches.find(s => [s.up, s.down, s.left, s.right, s.push].includes(Number(selectedKeyId)));
      if (!sw) return false;
      return profiles[currentDevKey]?.sw_locks?.[currentMode]?.[sw.num] || false;
    }

    function toggleSwLock(swNum) {
      const prof = profiles[currentDevKey];
      if (!prof.sw_locks[currentMode]) prof.sw_locks[currentMode] = {};
      const cur = prof.sw_locks[currentMode][swNum] || false;
      prof.sw_locks[currentMode][swNum] = !cur;

      const btn = document.getElementById(`btnLock_sw${swNum}`);
      if (btn) {
        btn.textContent = !cur ? "🔒 잠김" : "🔓 해제";
        btn.className = !cur ? "text-[11px] px-2 py-0.5 rounded bg-rose-600 text-white font-bold" : "text-[11px] px-2 py-0.5 rounded bg-gray-700 text-gray-300 hover:text-white";
      }
      checkLockState();
    }

    function switchMode(m) {
      currentMode = m;
      document.querySelectorAll(".mode-btn").forEach((b, idx) => {
        if (idx + 1 === m) {
          b.className = "mode-btn px-6 py-1 rounded text-xs font-bold bg-[#5865f2] text-white shadow";
        } else {
          b.className = "mode-btn px-6 py-1 rounded text-xs font-bold bg-[#2f3136] text-gray-400 hover:text-white";
        }
      });

      const prof = profiles[currentDevKey];
      document.getElementById("txtModeName").value = prof?.mode_names?.[m] || `모드 ${m}`;

      document.querySelectorAll("[id^='keyBtn_']").forEach(b => updateKeyButtonContent(b));
      selectKeyForEdit(selectedKeyId);
    }

    function onModeNameChanged() {
      const name = document.getElementById("txtModeName").value.trim();
      if (name && profiles[currentDevKey]?.mode_names) {
        profiles[currentDevKey].mode_names[currentMode] = name;
      }
    }

    function onKeyTypeChanged() {
      const val = document.getElementById("selKeyType").value;
      if (val === "H") {
        document.getElementById("holdTargetRow").classList.remove("hidden");
      } else {
        document.getElementById("holdTargetRow").classList.add("hidden");
        subTarget = "tap";
      }
      refreshEditorView();
    }

    function onSubTargetChanged() {
      const radios = document.getElementsByName("subTarget");
      for (const r of radios) {
        if (r.checked) subTarget = r.value;
      }
      refreshEditorView();
    }

    function startMacroRecord() {
      if (isCurrentKeyLocked()) return;
      isRecording = true;
      currentEditingEvents = [];
      renderEventList();
      lastKeyTime = Date.now();

      document.getElementById("btnRecStart").disabled = true;
      document.getElementById("btnRecStop").disabled = false;
      document.getElementById("btnRecStop").className = "bg-rose-600 hover:bg-rose-700 text-white text-xs px-2.5 py-1 rounded font-bold transition";
      const captureBox = document.getElementById("recCaptureBox");
      captureBox.value = "[기록 중...] 키보드를 누르세요";
      captureBox.className = "bg-red-950/40 text-rose-300 text-xs px-3 py-2 rounded border border-rose-500 outline-none text-center font-bold";

      window.addEventListener("keydown", handleGlobalKeyDown);
      window.addEventListener("keyup", handleGlobalKeyUp);
    }

    function stopMacroRecord() {
      isRecording = false;
      window.removeEventListener("keydown", handleGlobalKeyDown);
      window.removeEventListener("keyup", handleGlobalKeyUp);

      document.getElementById("btnRecStart").disabled = false;
      document.getElementById("btnRecStop").disabled = true;
      document.getElementById("btnRecStop").className = "bg-gray-600 text-gray-400 text-xs px-2.5 py-1 rounded font-semibold transition cursor-not-allowed";
      const captureBox = document.getElementById("recCaptureBox");
      captureBox.value = "기록 완료됨. 매크로 이름 확인 후 [적용]을 누르세요.";
      captureBox.className = "bg-[#202225] text-cyan-300 text-xs px-3 py-2 rounded border border-gray-700 outline-none text-center";
    }

    function handleGlobalKeyDown(e) {
      if (!isRecording) return;
      e.preventDefault();
      const now = Date.now();
      const elapsed = now - lastKeyTime;
      lastKeyTime = now;

      if (currentEditingEvents.length > 0 && elapsed > 20) {
        currentEditingEvents.push({ t: "d", ms: elapsed });
      }

      const keyName = normalizeKey(e.key);
      currentEditingEvents.push({ t: "p", k: keyName });
      document.getElementById("recCaptureBox").value = `입력 감지: ${keyName}`;
      renderEventList();
    }

    function handleGlobalKeyUp(e) {
      if (!isRecording) return;
      e.preventDefault();
      const now = Date.now();
      const elapsed = now - lastKeyTime;
      lastKeyTime = now;

      if (elapsed > 20) {
        currentEditingEvents.push({ t: "d", ms: elapsed });
      }

      const keyName = normalizeKey(e.key);
      currentEditingEvents.push({ t: "r", k: keyName });
      renderEventList();
    }

    function normalizeKey(k) {
      if (k === "Control") return "Ctrl";
      if (k === "Escape") return "Esc";
      if (k === " ") return "Space";
      return k;
    }

    function deleteSelectedEvent() {
      const list = document.getElementById("macroEventList");
      const idx = list.selectedIndex;
      if (idx >= 0 && idx < currentEditingEvents.length) {
        currentEditingEvents.splice(idx, 1);
        renderEventList();
        if (currentEditingEvents.length > 0) {
          list.selectedIndex = Math.min(idx, currentEditingEvents.length - 1);
        }
      }
    }

    function insertManualDelay() {
      const ms = prompt("추가할 지연 시간(ms)을 입력하세요:\n(예: 100ms)", "100");
      if (ms && !isNaN(ms)) {
        const list = document.getElementById("macroEventList");
        const idx = list.selectedIndex >= 0 ? list.selectedIndex + 1 : currentEditingEvents.length;
        currentEditingEvents.splice(idx, 0, { t: "d", ms: parseInt(ms, 10) });
        renderEventList();
        list.selectedIndex = idx;
      }
    }

    function moveEventUp() {
      const list = document.getElementById("macroEventList");
      const idx = list.selectedIndex;
      if (idx > 0) {
        const temp = currentEditingEvents[idx];
        currentEditingEvents[idx] = currentEditingEvents[idx - 1];
        currentEditingEvents[idx - 1] = temp;
        renderEventList();
        list.selectedIndex = idx - 1;
      }
    }

    function moveEventDown() {
      const list = document.getElementById("macroEventList");
      const idx = list.selectedIndex;
      if (idx >= 0 && idx < currentEditingEvents.length - 1) {
        const temp = currentEditingEvents[idx];
        currentEditingEvents[idx] = currentEditingEvents[idx + 1];
        currentEditingEvents[idx + 1] = temp;
        renderEventList();
        list.selectedIndex = idx + 1;
      }
    }

    function removeAllDelays() {
      currentEditingEvents = currentEditingEvents.filter(ev => ev.t !== "d");
      renderEventList();
    }

    function clearCurrentSequence() {
      currentEditingEvents = [];
      renderEventList();
    }

    function onCategoryChanged() {
      const cat = document.getElementById("selCategory").value;
      const itemSel = document.getElementById("selKeyItem");
      itemSel.innerHTML = "";
      (CATALOG[cat] || []).forEach(it => {
        const opt = document.createElement("option");
        opt.value = it;
        opt.textContent = it;
        itemSel.appendChild(opt);
      });
      onKeyItemChanged();
    }

    function onKeyItemChanged() {
      const it = document.getElementById("selKeyItem").value;
      if (!it) return;
      let labelName = it;
      if (PRESETS[it]) {
        labelName = PRESETS[it].label;
      }
      document.getElementById("txtMacroLabel").value = labelName;
    }

    function addCatalogKeyToSequence() {
      if (isCurrentKeyLocked()) return;
      const it = document.getElementById("selKeyItem").value;
      if (!it) return;

      if (PRESETS[it]) {
        currentEditingEvents.push(...JSON.parse(JSON.stringify(PRESETS[it].seq)));
        document.getElementById("txtMacroLabel").value = PRESETS[it].label;
      } else {
        currentEditingEvents.push({ t: "p", k: it }, { t: "r", k: it });
        document.getElementById("txtMacroLabel").value = it;
      }
      renderEventList();
    }

    function applyMacroToKey() {
      if (isCurrentKeyLocked()) return;
      const prof = profiles[currentDevKey];
      const keyData = prof.modes[currentMode][selectedKeyId];
      const selTypeVal = document.getElementById("selKeyType").value;
      const labelVal = document.getElementById("txtMacroLabel").value.trim() || "매크로";

      keyData.type = selTypeVal;

      if (selTypeVal === "H" && subTarget === "hold") {
        keyData.hold_label = labelVal.substring(0, 12);
        keyData.hold_macro = JSON.parse(JSON.stringify(currentEditingEvents));
      } else {
        keyData.label = labelVal.substring(0, 12);
        keyData.macro = JSON.parse(JSON.stringify(currentEditingEvents));
      }

      const btn = document.getElementById(`keyBtn_${selectedKeyId}`);
      if (btn) updateKeyButtonContent(btn);

      document.getElementById("btnApplyKey").textContent = "적용 완료!";
      document.getElementById("btnApplyKey").className = "bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-6 py-2 rounded font-bold transition shadow";
      setTimeout(() => {
        document.getElementById("btnApplyKey").textContent = "현재 키에 적용";
        document.getElementById("btnApplyKey").className = "bg-[#4f545c] hover:bg-gray-600 text-white text-xs px-6 py-2 rounded font-bold transition shadow";
      }, 1000);
    }

    async function writeToBoard() {
      if (!serialPort || !serialPort.writable) {
        alert("먼저 상단의 [직렬 포트 연결]을 완료해 주세요.");
        return;
      }

      const cfg = DEVICE_CONFIGS[currentDevKey];
      const prof = profiles[currentDevKey];

      setStatus("보드에 전송 중...", "warn");
      document.getElementById("btnWriteBoard").textContent = "전송 중...";

      try {
        await sendSerialText("CMD_CLEAR\n");
        await new Promise(r => setTimeout(r, 40));

        function buildSeqStr(events) {
          return (events || []).map(ev => {
            if (ev.t === "d") return `D_${ev.ms}`;
            if (ev.t === "p") return `P_${ev.k}`;
            if (ev.t === "r") return `R_${ev.k}`;
            return "";
          }).filter(Boolean).join(";");
        }

        if (cfg.protocol === "full") {
          for (let m = 1; m <= 4; m++) {
            const mName = prof.mode_names[m] || `작업${m}`;
            await sendSerialText(`CMD_SET_NAME:${m}:${mName}\n`);
            await new Promise(r => setTimeout(r, 10));

            for (const [kid, val] of Object.entries(prof.modes[m] || {})) {
              const ktype = val.type || "N";
              const label = (val.label || "미설정").replace(/[:;]/g, "");
              const mstr = buildSeqStr(val.macro);
              const hlabel = (val.hold_label || "").replace(/[:;]/g, "");
              const hmstr = buildSeqStr(val.hold_macro);

              await sendSerialText(`CMD_SET:${m},${kid}:${ktype}:${label}:${mstr}:${hlabel}:${hmstr}\n`);
              await new Promise(r => setTimeout(r, 8));
            }
          }
        } else if (cfg.protocol === "15k_legacy") {
          for (let m = 2; m <= 4; m++) {
            for (const [kid, val] of Object.entries(prof.modes[m] || {})) {
              if (!val.macro || val.macro.length === 0) continue;
              const label = (val.label || "매크로").replace(/[:;]/g, "");
              const mstr = buildSeqStr(val.macro);

              await sendSerialText(`CMD_SET:${m},${kid}:${label}:${mstr}\n`);
              await new Promise(r => setTimeout(r, 12));
            }
          }
        }

        await sendSerialText("CMD_SAVE_DONE\n");

      } catch (err) {
        setStatus("저장 실패: " + err.message, "err");
        document.getElementById("btnWriteBoard").textContent = "보드에 저장";
      }
    }

    async function readFromBoard() {
      const cfg = DEVICE_CONFIGS[currentDevKey];
      if (!cfg.supports_read_all) {
        alert(cfg.title + " 모델은 펌웨어 규격상 보드 읽기를 지원하지 않습니다.\nPC 불러오기(JSON)를 이용해 주세요.");
        return;
      }
      if (!serialPort || !serialPort.writable) {
        alert("먼저 상단의 [직렬 포트 연결]을 완료해 주세요.");
        return;
      }

      isReadingBoard = true;
      setStatus("보드 데이터 수신 및 동기화 중...", "warn");
      const btn = document.getElementById("btnReadBoard");
      btn.textContent = "읽는 중...";
      btn.className = "bg-amber-600 text-white text-xs px-3 py-1.5 rounded font-semibold transition animate-pulse";

      await sendSerialText("CMD_READ_ALL\n");

      if (readTimeoutTimer) clearTimeout(readTimeoutTimer);
      readTimeoutTimer = setTimeout(() => {
        if (isReadingBoard) {
          isReadingBoard = false;
          setStatus("보드 데이터 수신 완료 (타임아웃 마감)", "ok");
          btn.textContent = "보드에서 읽음";
          btn.className = "bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded font-semibold transition";
          switchMode(currentMode);
        }
      }, 2500);
    }

    function saveProfileToFile() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(profiles[currentDevKey], null, 2));
      const dlAnchor = document.createElement("a");
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `${currentDevKey}_profile.json`);
      dlAnchor.click();
      dlAnchor.remove();
      setStatus("PC 저장 완료", "ok");
    }

    function loadProfileFromFile() {
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = ".json";
      fileInput.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const loaded = JSON.parse(ev.target.result);
            profiles[currentDevKey] = loaded;
            renderDeviceLayout();
            switchMode(currentMode);
            setStatus("프로필 불러오기 성공", "ok");
          } catch (err) {
            alert("유효한 JSON 프로필 파일이 아닙니다.");
          }
        };
        reader.readAsText(file);
      };
      fileInput.click();
    }

    window.mk_single = mk_single;
    window.createSingleKey = createSingleKey;
    window.directOpenSerialPort = directOpenSerialPort;
    window.resetSerialLock = resetSerialLock;
    window.sendBootloaderCommand = sendBootloaderCommand;
    window.switchMode = switchMode;
    window.onModeNameChanged = onModeNameChanged;
    window.onKeyTypeChanged = onKeyTypeChanged;
    window.onSubTargetChanged = onSubTargetChanged;
    window.startMacroRecord = startMacroRecord;
    window.stopMacroRecord = stopMacroRecord;
    window.clearCurrentSequence = clearCurrentSequence;
    window.deleteSelectedEvent = deleteSelectedEvent;
    window.insertManualDelay = insertManualDelay;
    window.moveEventUp = moveEventUp;
    window.moveEventDown = moveEventDown;
    window.removeAllDelays = removeAllDelays;
    window.onCategoryChanged = onCategoryChanged;
    window.onKeyItemChanged = onKeyItemChanged;
    window.addCatalogKeyToSequence = addCatalogKeyToSequence;
    window.applyMacroToKey = applyMacroToKey;
    window.writeToBoard = writeToBoard;
    window.readFromBoard = readFromBoard;
    window.saveProfileToFile = saveProfileToFile;
    window.loadProfileFromFile = loadProfileFromFile;

    window.onload = () => {
      initDefaultProfiles();
      renderDeviceLayout();
      onCategoryChanged();
      switchMode(1);
    };
  </script>
